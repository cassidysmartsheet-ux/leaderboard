<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassidy Paving - Sales Leaderboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:linear-gradient(160deg,#0a0e14 0%,#141c28 40%,#1a1a1a 100%);
  color:#fff;height:100vh;display:flex;flex-direction:column;
  padding:20px 30px 15px;overflow:hidden;
}

/* HEADER */
.header{
  display:flex;align-items:center;justify-content:center;gap:25px;
  margin-bottom:15px;padding-bottom:12px;position:relative;
}
.header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent 5%,#CC0000 30%,#ff3333 50%,#CC0000 70%,transparent 95%);
  box-shadow:0 0 15px rgba(204,0,0,0.5);
}
.logo{height:65px;filter:drop-shadow(0 0 8px rgba(204,0,0,0.3))}
.hdiv{width:3px;height:50px;background:#CC0000;border-radius:2px}
.htxt h1{font-size:2.2rem;font-weight:800;letter-spacing:3px;color:#fff;line-height:1}
.htxt h1 span{color:#CC0000}
.htxt p{font-size:0.85rem;color:#777;letter-spacing:4px;text-transform:uppercase;margin-top:4px}

/* TWO-PANEL LAYOUT */
.panels{flex:1;display:flex;gap:20px;min-height:0;overflow:hidden}
.panel{
  flex:1;display:flex;flex-direction:column;
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px;padding:12px 15px 10px;
  position:relative;
}
.panel-title{
  text-align:center;font-size:1.1rem;font-weight:800;
  letter-spacing:3px;text-transform:uppercase;
  margin-bottom:8px;padding-bottom:6px;
  border-bottom:2px solid rgba(204,0,0,0.3);
}
.panel-title.est{color:#4ea8ff}
.panel-title.con{color:#CC0000}

/* MAIN LAYOUT inside each panel */
.main{flex:1;display:flex;align-items:stretch;justify-content:center;gap:0;min-height:0}

/* SCALE COLUMN */
.yscale{
  position:relative;width:45px;margin-top:55px;margin-bottom:45px;
}
.yscale-label{
  position:absolute;right:6px;font-size:0.62rem;color:rgba(255,255,255,0.4);
  font-weight:600;white-space:nowrap;transform:translateY(50%);
}
.yscale-tick{
  position:absolute;right:0;width:6px;height:1px;
  background:rgba(255,255,255,0.3);
}

/* REP COLUMN */
.rep{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;max-width:160px}

/* BADGES */
.badge{
  background:linear-gradient(135deg,rgba(204,0,0,0.12),rgba(30,5,5,0.7));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:6px 10px;border-radius:10px;
  border:1px solid rgba(204,0,0,0.4);
  box-shadow:0 4px 16px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08),0 0 12px rgba(204,0,0,0.1);
  text-align:center;min-width:80px;position:relative;overflow:hidden;
  animation:badge-breathe 4s ease-in-out infinite;
}
.badge.est-badge{
  background:linear-gradient(135deg,rgba(78,168,255,0.12),rgba(5,15,30,0.7));
  border:1px solid rgba(78,168,255,0.4);
  box-shadow:0 4px 16px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08),0 0 12px rgba(78,168,255,0.1);
}
.badge::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent,rgba(204,0,0,0.12),transparent,transparent);
  animation:badge-rotate 6s linear infinite;
}
.badge.est-badge::before{
  background:conic-gradient(from 0deg,transparent,rgba(78,168,255,0.12),transparent,transparent);
}
@keyframes badge-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes badge-breathe{
  0%,100%{box-shadow:0 4px 16px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08),0 0 12px rgba(204,0,0,0.1)}
  50%{box-shadow:0 4px 16px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.12),0 0 25px rgba(204,0,0,0.25)}
}
.badge-row{display:flex;gap:5px;align-items:stretch;width:100%}
.badge-row .badge{flex:1;min-width:0;padding:5px 6px}
.badge-lbl{font-size:0.55rem;color:#aaa;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:1px;position:relative;z-index:1}
.badge-val{font-size:1.15rem;font-weight:700;color:#fff;position:relative;z-index:1;text-shadow:0 0 8px rgba(204,0,0,0.3)}
.badge.est-badge .badge-val{text-shadow:0 0 8px rgba(78,168,255,0.3)}
.badge-val.sm{font-size:0.95rem}

/* THERMOMETER */
.thermo{
  position:relative;width:65px;flex:1;min-height:60px;
  background:rgba(255,255,255,0.04);
  border:2px solid rgba(255,255,255,0.12);border-radius:35px;
  overflow:visible;
}
.thermo-inner{
  position:absolute;top:0;left:0;right:0;bottom:0;
  border-radius:33px;overflow:hidden;
}
.thermo.lead{border-color:rgba(204,0,0,0.5);animation:pulse 2.5s ease-in-out infinite}
.thermo.est-lead{border-color:rgba(78,168,255,0.5);animation:pulse-est 2.5s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:inset 0 0 20px rgba(0,0,0,0.3),0 0 10px rgba(204,0,0,0.15)}
  50%{box-shadow:inset 0 0 20px rgba(0,0,0,0.3),0 0 25px rgba(204,0,0,0.4),0 0 45px rgba(204,0,0,0.12)}
}
@keyframes pulse-est{
  0%,100%{box-shadow:inset 0 0 20px rgba(0,0,0,0.3),0 0 10px rgba(78,168,255,0.15)}
  50%{box-shadow:inset 0 0 20px rgba(0,0,0,0.3),0 0 25px rgba(78,168,255,0.4),0 0 45px rgba(78,168,255,0.12)}
}

/* GRID LINES */
.gline{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,0.07);pointer-events:none;z-index:1}

/* SEGMENTS */
.seg{position:absolute;left:0;right:0;overflow:visible}
.seg-fill{position:absolute;top:0;left:0;right:0;bottom:0;border-top:1px solid rgba(0,0,0,0.35)}
.seg-fill:first-child{border-top:none}
.seg-shine{
  position:absolute;top:0;left:5px;width:8px;bottom:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.22),rgba(255,255,255,0.06));
  border-radius:4px;pointer-events:none;
}

/* SEGMENT LABELS */
.seg-label{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;z-index:5;overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,0.8);
}
.seg-label .sl-amt{font-weight:700;color:#fff;white-space:nowrap}
.seg-label .sl-date{color:rgba(255,255,255,0.7);white-space:nowrap}
.seg-label.sz-lg .sl-amt{font-size:0.75rem}
.seg-label.sz-lg .sl-date{font-size:0.55rem;margin-top:1px}
.seg-label.sz-md .sl-amt{font-size:0.65rem}
.seg-label.sz-md .sl-date{font-size:0.5rem;margin-top:0}
.seg-label.sz-sm .sl-amt{font-size:0.55rem}
.seg-label.sz-sm .sl-date{display:none}
.seg-label.sz-xs{display:none}

/* BOTTOM INFO */
.rev{font-size:1.05rem;font-weight:700;color:#fff;text-shadow:0 0 6px rgba(204,0,0,0.3)}
.rev.est-rev{text-shadow:0 0 6px rgba(78,168,255,0.3)}
.name{
  font-size:1.2rem;font-weight:900;color:#CC0000;text-transform:uppercase;
  letter-spacing:2px;
  text-shadow:0 0 15px rgba(204,0,0,0.4),0 0 30px rgba(204,0,0,0.15);
  animation:name-glow 3s ease-in-out infinite;
}
@keyframes name-glow{
  0%,100%{text-shadow:0 0 15px rgba(204,0,0,0.4),0 0 30px rgba(204,0,0,0.15)}
  50%{text-shadow:0 0 20px rgba(204,0,0,0.6),0 0 40px rgba(204,0,0,0.25)}
}

/* TOTALS BAR */
.totals-bar{
  display:flex;justify-content:center;gap:30px;
  padding:8px 0 0;margin-top:8px;
  border-top:1px solid rgba(255,255,255,0.08);
}
.total-item{text-align:center}
.total-lbl{font-size:0.6rem;color:#777;text-transform:uppercase;letter-spacing:2px}
.total-val{font-size:1.3rem;font-weight:800;color:#CC0000;text-shadow:0 0 10px rgba(204,0,0,0.3)}
.total-val.est-color{color:#4ea8ff;text-shadow:0 0 10px rgba(78,168,255,0.3)}
.total-val.white{color:#fff}

/* BACKLOG BADGE */
.backlog-bar{
  display:flex;justify-content:center;gap:20px;padding-top:6px;
}
.backlog-badge{
  background:linear-gradient(135deg,rgba(255,200,0,0.1),rgba(40,30,0,0.7));
  border:1px solid rgba(255,200,0,0.35);border-radius:10px;
  padding:6px 20px;text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.3),0 0 12px rgba(255,200,0,0.1);
}
.backlog-badge .badge-lbl{color:#bba040}
.backlog-badge .badge-val{color:#ffd700;font-size:1.3rem;text-shadow:0 0 8px rgba(255,200,0,0.3)}

/* LOADING */
.loading{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:#555;letter-spacing:2px;
}

/* RESPONSIVE */
@media(max-width:1400px){
  body{padding:10px 15px}
  .htxt h1{font-size:1.8rem}.logo{height:55px}
  .thermo{width:55px}
  .badge{min-width:60px;padding:4px 6px}.badge-val{font-size:1rem}
  .name{font-size:1rem;letter-spacing:1px}.rev{font-size:0.9rem}
  .panels{gap:10px}.panel{padding:8px 10px 8px}
}
@media(min-width:2500px){
  .htxt h1{font-size:3rem}.logo{height:90px}
  .thermo{width:90px}
  .badge-val{font-size:1.6rem}.name{font-size:1.8rem;letter-spacing:3px}.rev{font-size:1.3rem}
}
</style>
</head>

  <div class="hdiv"></div>

    <h1>SALES <span>LEADERBOARD</span></h1>
    <p>Weekly Performance Tracker</p>
  </div>
</div>

<div class="panels" id="panels">
  <div class="loading">Loading leaderboard data...</div>
</div>

<div class="totals-bar" id="totalsBar" style="display:none"></div>
<div class="backlog-bar" id="backlogBar" style="display:none"></div>

<script>
function fmt(v){
  if(v>=1000000)return '$'+(v/1000000).toFixed(2)+'M';
  if(v>=1000)return '$'+(v/1000).toFixed(0)+'K';
  return '$'+v;
}

function fmtM(v){
  if(v>=1000000)return '$'+(v/1000000).toFixed(1)+'M';
  if(v>=1000)return '$'+(v/1000).toFixed(0)+'K';
  return '$'+v;
}

async function loadAndRender(){
  var panels=document.getElementById('panels');
  var data;

  try {
    var resp = await fetch('data.json?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    data = await resp.json();
  } catch(e) {
    panels.innerHTML = '<div class="loading">Could not load data.</div>';
    return;
  }

  var JOBS = data.jobs || [];
  var ESTIMATES = data.estimates || [];
  var MAX_REV = data.maxRevenue || 6000000;
  var MAX_EST_REV = data.maxEstimateRevenue || 8000000;
  var REP_ORDER = data.repOrder || [];
  var BACKLOG = data.backlog || 0;

  panels.innerHTML = '';

  // ========== ESTIMATES PANEL ==========
  var estPanel = document.createElement('div');
  estPanel.className = 'panel';
  var estTitle = document.createElement('div');
  estTitle.className = 'panel-title est';
  estTitle.textContent = 'ESTIMATES';
  estPanel.appendChild(estTitle);

  var estMain = document.createElement('div');
  estMain.className = 'main';

  // Group estimates by rep
  var estGrouped = {};
  REP_ORDER.forEach(function(r){ estGrouped[r] = [] });
  ESTIMATES.forEach(function(e){ if(estGrouped[e.rep]) estGrouped[e.rep].push(e) });
  Object.keys(estGrouped).forEach(function(r){
    estGrouped[r].sort(function(a,b){ return a.date < b.date ? -1 : 1 });
  });

  // Find est leader
  var maxEstRev=0, estLeader='';
  REP_ORDER.forEach(function(r){
    var t=0; estGrouped[r].forEach(function(e){ t+=e.amount });
    if(t>maxEstRev){ maxEstRev=t; estLeader=r }
  });

  // Estimate scale
  var estScaleVals=[];
  var estStep = MAX_EST_REV >= 10000000 ? 2000000 : MAX_EST_REV >= 4000000 ? 1000000 : 500000;
  for(var v=estStep; v<=MAX_EST_REV; v+=estStep){
    estScaleVals.push({pct:(v/MAX_EST_REV)*100, label: v>=1000000?'$'+(v/1000000)+'M':'$'+(v/1000)+'K'});
  }
  if(estStep >= 1000000){
    for(var v2=estStep/2; v2<MAX_EST_REV; v2+=estStep){
      estScaleVals.push({pct:(v2/MAX_EST_REV)*100, label: v2>=1000000?'$'+(v2/1000000)+'M':'$'+(v2/1000)+'K'});
    }
  }
  estScaleVals.sort(function(a,b){return a.pct-b.pct});

  // Est Y-axis
  var estScale = document.createElement('div');
  estScale.className = 'yscale';
  estScaleVals.forEach(function(s){
    var lbl=document.createElement('div');lbl.className='yscale-label';lbl.style.bottom=s.pct+'%';lbl.textContent=s.label;estScale.appendChild(lbl);
    var tick=document.createElement('div');tick.className='yscale-tick';tick.style.bottom=s.pct+'%';estScale.appendChild(tick);
  });
  estMain.appendChild(estScale);

  var estShades=['#2a7fff','#1a6ae0','#3d8fff','#1560cc','#4da0ff','#0f50b0','#5aadff'];

  // Est rep columns
  var totalEstCount=0, totalEstAmt=0;
  REP_ORDER.forEach(function(rep,ri){
    var ests = estGrouped[rep];
    var total=0, totalCnt=0;
    ests.forEach(function(e){ total+=e.amount; totalCnt+=e.count });
    totalEstCount += totalCnt;
    totalEstAmt += total;
    var isLead = (rep===estLeader);

    var col = document.createElement('div');
    col.className = 'rep';

    // Count badge
    var badge = document.createElement('div');
    badge.className = 'badge est-badge';
    badge.innerHTML = '<div class="badge-lbl">Count</div><div class="badge-val">' + totalCnt + '</div>';
    col.appendChild(badge);

    // Thermometer
    var thermo = document.createElement('div');
    thermo.className = 'thermo' + (isLead ? ' est-lead' : '');
    var inner = document.createElement('div');
    inner.className = 'thermo-inner';

    estScaleVals.forEach(function(s){
      var gl=document.createElement('div');gl.className='gline';gl.style.bottom=s.pct+'%';inner.appendChild(gl);
    });

    var cumPct=0;
    ests.forEach(function(est,ji){
      var hPct=(est.amount/MAX_EST_REV)*100;
      var seg=document.createElement('div');
      seg.className='seg';seg.style.bottom=cumPct+'%';seg.style.height='0%';
      seg.dataset.targetH=hPct;seg.dataset.delay=''+(ri*200+ji*120);

      var fill=document.createElement('div');fill.className='seg-fill';
      fill.style.background=estShades[ji%estShades.length];seg.appendChild(fill);

      var shine=document.createElement('div');shine.className='seg-shine';seg.appendChild(shine);

      var label=document.createElement('div');label.className='seg-label';
      var segPx=hPct/100*350;
      var szClass=segPx>=45?'sz-lg':segPx>=30?'sz-md':segPx>=18?'sz-sm':'sz-xs';
      label.classList.add(szClass);
      var shortDate=(parseInt(est.date.split('-')[1]))+'/'+parseInt(est.date.split('-')[2]);
      label.innerHTML='<div class="sl-amt">'+fmt(est.amount)+'</div>'+(szClass!=='sz-sm'&&szClass!=='sz-xs'?'<div class="sl-date">'+shortDate+'</div>':'');
      seg.appendChild(label);

      inner.appendChild(seg);
      cumPct+=hPct;
    });

    thermo.appendChild(inner);
    col.appendChild(thermo);

    var rev=document.createElement('div');rev.className='rev est-rev';rev.textContent=fmt(total);
    col.appendChild(rev);

    var nm=document.createElement('div');nm.className='name';nm.style.color='#4ea8ff';
    nm.style.textShadow='0 0 15px rgba(78,168,255,0.4),0 0 30px rgba(78,168,255,0.15)';
    nm.textContent=rep;
    col.appendChild(nm);

    estMain.appendChild(col);
  });

  estPanel.appendChild(estMain);
  panels.appendChild(estPanel);

  // ========== CONTRACTS PANEL ==========
  var conPanel = document.createElement('div');
  conPanel.className = 'panel';
  var conTitle = document.createElement('div');
  conTitle.className = 'panel-title con';
  conTitle.textContent = 'CONTRACTS';
  conPanel.appendChild(conTitle);

  var conMain = document.createElement('div');
  conMain.className = 'main';

  // Group jobs by rep
  var jobGrouped = {};
  REP_ORDER.forEach(function(r){ jobGrouped[r] = [] });
  JOBS.forEach(function(j){ if(jobGrouped[j.rep]) jobGrouped[j.rep].push(j) });
  Object.keys(jobGrouped).forEach(function(r){
    jobGrouped[r].sort(function(a,b){ return a.date < b.date ? -1 : 1 });
  });

  // Find contract leader
  var maxConRev=0, conLeader='';
  REP_ORDER.forEach(function(r){
    var t=0; jobGrouped[r].forEach(function(j){ t+=j.amount });
    if(t>maxConRev){ maxConRev=t; conLeader=r }
  });

  // Contract scale
  var conScaleVals=[];
  var conStep = MAX_REV >= 10000000 ? 2000000 : MAX_REV >= 4000000 ? 1000000 : 500000;
  for(var v=conStep; v<=MAX_REV; v+=conStep){
    conScaleVals.push({pct:(v/MAX_REV)*100, label: v>=1000000?'$'+(v/1000000)+'M':'$'+(v/1000)+'K'});
  }
  if(conStep >= 1000000){
    for(var v2=conStep/2; v2<MAX_REV; v2+=conStep){
      conScaleVals.push({pct:(v2/MAX_REV)*100, label: v2>=1000000?'$'+(v2/1000000)+'M':'$'+(v2/1000)+'K'});
    }
  }
  conScaleVals.sort(function(a,b){return a.pct-b.pct});

  // Con Y-axis
  var conScale = document.createElement('div');
  conScale.className = 'yscale';
  conScaleVals.forEach(function(s){
    var lbl=document.createElement('div');lbl.className='yscale-label';lbl.style.bottom=s.pct+'%';lbl.textContent=s.label;conScale.appendChild(lbl);
    var tick=document.createElement('div');tick.className='yscale-tick';tick.style.bottom=s.pct+'%';conScale.appendChild(tick);
  });
  conMain.appendChild(conScale);

  var conShades=['#cc0000','#b30000','#d42a2a','#a00000','#cc1515','#bf0000','#d11a1a'];

  // Con rep columns
  var totalConCount=0, totalConAmt=0, totalGPDollar=0;
  REP_ORDER.forEach(function(rep,ri){
    var jobs = jobGrouped[rep];
    var total=0, totalCnt=0, gpSum=0, gpDollar=0;
    jobs.forEach(function(j){
      total+=j.amount;
      totalCnt+=(j.count||1);
      gpSum+=j.gp;
      gpDollar+=(j.amount * (j.gp/100));
    });
    totalConCount += totalCnt;
    totalConAmt += total;
    totalGPDollar += gpDollar;
    var avgGP = jobs.length ? (gpSum/jobs.length) : 0;
    var isLead = (rep===conLeader);

    var col = document.createElement('div');
    col.className = 'rep';

    // Badge row: Count | GP% | GP$
    var badgeRow = document.createElement('div');
    badgeRow.className = 'badge-row';

    var cntBadge = document.createElement('div');
    cntBadge.className = 'badge';
    cntBadge.innerHTML = '<div class="badge-lbl">Count</div><div class="badge-val">' + totalCnt + '</div>';
    badgeRow.appendChild(cntBadge);

    var gpBadge = document.createElement('div');
    gpBadge.className = 'badge';
    gpBadge.innerHTML = '<div class="badge-lbl">GP%</div><div class="badge-val sm">' + avgGP.toFixed(1) + '%</div>';
    badgeRow.appendChild(gpBadge);

    var gpDolBadge = document.createElement('div');
    gpDolBadge.className = 'badge';
    gpDolBadge.innerHTML = '<div class="badge-lbl">GP$</div><div class="badge-val sm">' + fmtM(Math.round(gpDollar)) + '</div>';
    badgeRow.appendChild(gpDolBadge);

    col.appendChild(badgeRow);

    // Thermometer
    var thermo = document.createElement('div');
    thermo.className = 'thermo' + (isLead ? ' lead' : '');
    var inner = document.createElement('div');
    inner.className = 'thermo-inner';

    conScaleVals.forEach(function(s){
      var gl=document.createElement('div');gl.className='gline';gl.style.bottom=s.pct+'%';inner.appendChild(gl);
    });

    var cumPct=0;
    jobs.forEach(function(job,ji){
      var hPct=(job.amount/MAX_REV)*100;
      var seg=document.createElement('div');
      seg.className='seg';seg.style.bottom=cumPct+'%';seg.style.height='0%';
      seg.dataset.targetH=hPct;seg.dataset.delay=''+(ri*200+ji*120);

      var fill=document.createElement('div');fill.className='seg-fill';
      fill.style.background=conShades[ji%conShades.length];seg.appendChild(fill);

      var shine=document.createElement('div');shine.className='seg-shine';seg.appendChild(shine);

      var label=document.createElement('div');label.className='seg-label';
      var segPx=hPct/100*350;
      var szClass=segPx>=45?'sz-lg':segPx>=30?'sz-md':segPx>=18?'sz-sm':'sz-xs';
      label.classList.add(szClass);
      var shortDate=(parseInt(job.date.split('-')[1]))+'/'+parseInt(job.date.split('-')[2]);
      label.innerHTML='<div class="sl-amt">'+fmt(job.amount)+'</div>'+(szClass!=='sz-sm'&&szClass!=='sz-xs'?'<div class="sl-date">'+shortDate+'</div>':'');
      seg.appendChild(label);

      inner.appendChild(seg);
      cumPct+=hPct;
    });

    thermo.appendChild(inner);
    col.appendChild(thermo);

    var rev=document.createElement('div');rev.className='rev';rev.textContent=fmt(total);
    col.appendChild(rev);

    var nm=document.createElement('div');nm.className='name';nm.textContent=rep;
    col.appendChild(nm);

    conMain.appendChild(col);
  });

  conPanel.appendChild(conMain);
  panels.appendChild(conPanel);

  // ========== TOTALS BAR ==========
  var totalsBar = document.getElementById('totalsBar');
  totalsBar.style.display = 'flex';
  totalsBar.innerHTML = 
    '<div class="total-item"><div class="total-lbl">Est Count</div><div class="total-val est-color">' + totalEstCount + '</div></div>' +
    '<div class="total-item"><div class="total-lbl">Est Value</div><div class="total-val est-color">' + fmt(totalEstAmt) + '</div></div>' +
    '<div class="total-item"><div class="total-lbl">Contract Count</div><div class="total-val">' + totalConCount + '</div></div>' +
    '<div class="total-item"><div class="total-lbl">Contract Value</div><div class="total-val">' + fmt(totalConAmt) + '</div></div>' +
    '<div class="total-item"><div class="total-lbl">Total GP$</div><div class="total-val white">' + fmt(Math.round(totalGPDollar)) + '</div></div>';

  // Backlog
  if(BACKLOG > 0){
    var blBar = document.getElementById('backlogBar');
    blBar.style.display = 'flex';
    blBar.innerHTML = '<div class="backlog-badge"><div class="badge-lbl">Backlog</div><div class="badge-val">' + BACKLOG.toFixed(2) + 'M</div></div>';
  }

  // ========== ANIMATE ==========
  setTimeout(function(){
    var segs=document.querySelectorAll('.seg');
    for(var i=0;i<segs.length;i++){
      (function(seg){
        var delay=parseInt(seg.dataset.delay)||0;
        var targetH=seg.dataset.targetH;
        setTimeout(function(){
          seg.style.transition='height 0.8s cubic-bezier(0.22,1,0.36,1)';
          seg.style.height=targetH+'%';
        },300+delay);
      })(segs[i]);
    }
  },100);
}

loadAndRender();
setInterval(function(){ loadAndRender(); }, 300000);
</script>
</body>
</html>
